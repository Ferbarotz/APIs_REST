<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 50%, #60a5fa 100%);
        }
        .tarjeta {
            background: white;
            padding: 45px 50px;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
            text-align: center;
            max-width: 480px;
            width: 90%;
        }
        /* ← ESTA REGLA FALTABA EN TU ARCHIVO */
        .logo {
            width: 130px;
            height: 130px;
            object-fit: cover;
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.6);
            margin-bottom: 18px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        h1 { color: #1e3a8a; font-size: 2.2rem; margin-bottom: 10px; }
        .subtitulo { color: #64748b; margin-bottom: 30px; }
        .boton {
            display: block;
            margin: 10px auto;
            padding: 14px 0;
            width: 100%;
            max-width: 300px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.2s;
        }
        .boton.principal { background: #2563eb; color: white; }
        .boton.principal:hover { background: #1d4ed8; }
        .boton.secundario {
            background: #eef2ff;
            color: #1e3a8a;
            border: 1px solid #c7d2fe;
        }
        .boton.secundario:hover { background: #e0e7ff; }
        .pie { margin-top: 25px; font-size: 0.85rem; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="tarjeta">
        <img src="/static/logoFB.png" alt="Logo FB" class="logo">
        <h1>APIs</h1>
        <p class="subtitulo">API REST de gestión de usuarios</p>
        <a href="/usuarios" class="boton principal">Ver usuarios</a>
        <a href="/api/usuarios" class="boton secundario">Ver datos (JSON)</a>
        <p class="pie">© 2026 — Proyecto de práctica con Flask</p>
    </div>
</body>
</html>
