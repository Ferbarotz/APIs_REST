<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - APIs</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1e3a8a 0%, #6d28d9 50%, #d946ef 100%);
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 40px;
            background: rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }
        .marca { display: flex; align-items: center; gap: 12px; }
        .marca img {
            width: 45px; height: 45px;
            border-radius: 50%; object-fit: cover;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
        }
        .marca span { color: white; font-size: 1.3rem; font-weight: 700; }
        .opciones { display: flex; gap: 12px; }
        .boton {
            text-decoration: none;
            padding: 10px 22px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: 0.2s;
        }
        .boton.crear { background: white; color: #1e3a8a; }
        .boton.crear:hover { background: #e0e7ff; }
        .boton.ingresar { border: 1.5px solid white; color: white; }
        .boton.ingresar:hover { background: rgba(255, 255, 255, 0.15); }
        .tarjeta {
            background: white;
            max-width: 420px;
            width: 90%;
            margin: 80px auto;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.3);
            text-align: center;
        }
        .tarjeta h1 {
            font-size: 1.6rem;
            background: linear-gradient(90deg, #1e3a8a, #7c3aed, #db2777);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 8px;
        }
        .subtitulo { color: #64748b; margin-bottom: 25px; font-size: 0.95rem; }
        .campo { text-align: left; margin-bottom: 15px; }
        .campo label {
            display: block; font-size: 0.85rem;
            font-weight: 600; color: #475569; margin-bottom: 5px;
        }
        .campo input {
            width: 100%; padding: 10px 14px;
            border-radius: 8px; border: 1px solid #cbd5e1;
            font-size: 0.95rem; transition: 0.2s;
        }
        .campo input:focus {
            outline: none; border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15);
        }
        .boton-enviar {
            margin-top: 10px; width: 100%; padding: 12px;
            border: none; border-radius: 8px; cursor: pointer;
            font-weight: 600; color: white; font-size: 0.95rem;
            background: linear-gradient(90deg, #2563eb, #7c3aed);
            transition: 0.2s;
        }
        .boton-enviar:hover { filter: brightness(1.1); }
        #mensaje-exito, #mensaje-error {
            margin-top: 15px;
            font-weight: 600;
            display: none;
        }
        #mensaje-exito { color: #059669; }
        #mensaje-error { color: #dc2626; }
        .enlace-lista {
            color: #7c3aed;
            font-weight: 600;
            text-decoration: none;
            margin-left: 8px;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="marca">
            <img src="/static/logoFB.png" alt="Logo FB">
            <span>APIs</span>
        </div>
        <div class="opciones">
            <a href="/registro" class="boton crear">Registrarse</a>
            <a href="/ingresar" class="boton ingresar">Ingresar</a>
        </div>
    </nav>

    <div class="tarjeta">
        <h1>Registrarse</h1>
        <p class="subtitulo">Crea tu cuenta para usar la API</p>

        <form id="formulario-registro">
            <div class="campo">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" placeholder="Ejemplo: Ana Pérez" required>
            </div>
            <div class="campo">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="usuario@ejemplo.com" required>
            </div>
            <div class="campo">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Escribe una contraseña segura" required>
            </div>
            <button type="submit" class="boton-enviar">Registrarse</button>
        </form>

        <p id="mensaje-exito"></p>
        <p id="mensaje-error"></p>
    </div>

    <script>
        const formulario = document.getElementById('formulario-registro');
        const mensajeExito = document.getElementById('mensaje-exito');
        const mensajeError = document.getElementById('mensaje-error');

        formulario.addEventListener('submit', async (evento) => {
            evento.preventDefault();

            mensajeExito.style.display = 'none';
            mensajeError.style.display = 'none';

            const datos = {
                nombre: document.getElementById('nombre').value.trim(),
                email: document.getElementById('email').value.trim(),
                password: document.getElementById('password').value
            };

            try {
                const respuesta = await fetch('/api/usuarios', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });

                const resultado = await respuesta.json();

                if (respuesta.ok) {
                    mensajeExito.textContent = '¡Usuario creado correctamente!';
                    mensajeExito.style.display = 'block';
                    formulario.reset();
                } else {
                    mensajeError.textContent = resultado.error;
                    mensajeError.style.display = 'block';
                }
            } catch (error) {
                mensajeError.textContent = 'Ocurrió un error al crear el usuario.';
                mensajeError.style.display = 'block';
            }
        });
    </script>
</body>
</html>
