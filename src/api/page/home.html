<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APIs - Inicio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1e3a8a 0%, #6d28d9 50%, #d946ef 100%);
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 40px;
            background: rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }
        .marca { display: flex; align-items: center; gap: 12px; }
        .marca img {
            width: 45px; height: 45px;
            border-radius: 50%; object-fit: cover;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
        }
        .marca span { color: white; font-size: 1.3rem; font-weight: 700; }
        .opciones { display: flex; gap: 12px; }
        .boton {
            text-decoration: none;
            padding: 10px 22px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: 0.2s;
        }
        .boton.crear { background: white; color: #1e3a8a; }
        .boton.crear:hover { background: #e0e7ff; }
        .boton.ingresar { border: 1.5px solid white; color: white; }
        .boton.ingresar:hover { background: rgba(255, 255, 255, 0.15); }
        .hero {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 90px 20px;
            color: white;
        }
        .hero h1 { font-size: 3rem; margin-bottom: 15px; }
        .hero p { font-size: 1.15rem; opacity: 0.9; max-width: 550px; line-height: 1.6; }
        .enlace-lista {
            color: white;
            opacity: 0.85;
            text-decoration: underline;
            display: inline-block;
            margin-top: 25px;
        }
        .enlace-lista:hover { opacity: 1; }
        .pie { margin-top: 45px; font-size: 0.85rem; opacity: 0.7; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="marca">
            <img src="/static/logoFB.png" alt="Logo FB">
            <span>APIs</span>
        </div>
        <div class="opciones">
            <a href="/registro" class="boton crear">Registrarse</a>
            <a href="/ingresar" class="boton ingresar">Ingresar</a>
        </div>
    </nav>
    <section class="hero">
        <h1>Bienvenido a APIs</h1>
        <p>Tu API REST para gestionar usuarios: crea cuentas, administra datos y autentica a tus usuarios desde un solo lugar.</p>
        <a href="/usuarios" class="enlace-lista">Ver lista de usuarios</a>
        <p class="pie">© 2026 — Proyecto de práctica con Flask</p>
    </section>
</body>
</html>
