<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios - APIs</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1e3a8a 0%, #6d28d9 50%, #d946ef 100%);
            padding: 24px;
        }
        .contenedor {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 18px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            padding: 28px;
        }
        .cabecera {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .cabecera-portada {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 34px 0 24px;
        }
        .logo-portada {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.45);
        }
        .titulo-portada {
            color: white;
            font-size: 4rem;
            font-weight: 800;
            text-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
            letter-spacing: 1px;
            margin: 0;
        }
        .cabecera-izquierda {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .foto-perfil {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: #ffffff;
            border: 2px dashed #cbd5e1;
            flex-shrink: 0;
            overflow: hidden;
        }
        .acciones {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .boton-foto {
            border: 1.5px solid #2563eb;
            color: #2563eb;
            border-radius: 8px;
            padding: 10px 16px;
            font-weight: 600;
            font-size: 0.95rem;
            background: white;
            cursor: pointer;
            transition: 0.2s;
        }
        .boton-foto:hover { background: #eff6ff; }
        .mensaje-foto {
            margin-bottom: 14px;
            color: #2563eb;
            font-weight: 600;
            display: none;
        }
        .boton-volver {
            text-decoration: none;
            border: 1.5px solid #7c3aed;
            color: #7c3aed;
            border-radius: 8px;
            padding: 10px 16px;
            font-weight: 600;
            transition: 0.2s;
            display: inline-block;
        }
        .boton-volver:hover { background: #f3e8ff; }
        .boton-salir {
            text-decoration: none;
            border: 1.5px solid #dc2626;
            color: #dc2626;
            border-radius: 8px;
            padding: 10px 16px;
            font-weight: 600;
            transition: 0.2s;
            display: inline-block;
            cursor: pointer;
        }
        .boton-salir:hover { background: #fef2f2; }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            overflow: hidden;
            border-radius: 10px;
        }
        thead { background: #eef2ff; }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
            text-align: left;
            font-size: 0.95rem;
        }
        #mensaje-vacio {
            margin-top: 10px;
            color: #475569;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <header class="cabecera-portada">
        <img src="/static/logoFB.png" alt="Logo FB" class="logo-portada">
        <h1 class="titulo-portada">APIs</h1>
    </header>

    <div class="contenedor">
        <div class="cabecera">
            <div class="cabecera-izquierda">
                <div class="foto-perfil" title="Foto del usuario"></div>
            </div>
            <div class="acciones">
                <button type="button" id="boton-cambiar-foto" class="boton-foto">Cambiar foto</button>
                <input type="file" id="input-foto" accept="image/*" style="display:none">
                <a href="/api/usuarios" class="boton-volver">Ver datos (JSON)</a>
                <a href="/logout" class="boton-salir">Salir</a>
            </div>
        </div>
        <p id="mensaje-foto" class="mensaje-foto"></p>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Email</th>
                    <th>Foto</th>
                </tr>
            </thead>
            <tbody id="cuerpo-tabla"></tbody>
        </table>
        <p id="mensaje-vacio">Cargando usuarios…</p>
    </div>

    <script>
        const cuerpoTabla = document.getElementById('cuerpo-tabla');
        const mensajeVacio = document.getElementById('mensaje-vacio');
        const inputFoto = document.getElementById('input-foto');
        const fotoPerfil = document.querySelector('.foto-perfil');
        const mensajeFoto = document.getElementById('mensaje-foto');

        async function cargarUsuarios() {
            mensajeVacio.style.display = 'block';
            mensajeVacio.textContent = 'Cargando usuarios…';
            cuerpoTabla.innerHTML = '';

            try {
                const respuesta = await fetch('/api/usuarios');
                const usuarios = await respuesta.json();

                if (!Array.isArray(usuarios) || usuarios.length === 0) {
                    mensajeVacio.textContent = 'No hay usuarios todavía. Créalos desde el formulario de registro.';
                    return;
                }

                mensajeVacio.style.display = 'none';

                usuarios.forEach((u) => {
                    const fila = document.createElement('tr');
                    fila.innerHTML = `
                        <td>${u.id}</td>
                        <td>${u.nombre}</td>
                        <td>${u.email}</td>
                        <td>${u.foto ? '<img src="' + u.foto + '" alt="Foto" style="width:38px;height:38px;border-radius:50%;object-fit:cover;">' : '—'}</td>
                    `;
                    cuerpoTabla.appendChild(fila);
                });
            } catch (error) {
                mensajeVacio.style.display = 'block';
                mensajeVacio.textContent = 'No se pudo cargar la lista de usuarios.';
            }
        }

        // función para pintar la foto del usuario logueado en el círculo
        async function cargarPerfil() {
            try {
                const respuesta = await fetch('/api/yo');
                if (respuesta.ok) {
                    const usuario = await respuesta.json();
                    if (usuario.foto) {
                        fotoPerfil.innerHTML = '<img src="' + usuario.foto + '" alt="Foto de ' + usuario.nombre + '" style="width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;">';
                    }
                }
            } catch (error) { /* si no hay sesión no pasa nada */ }
        }

        document.getElementById('boton-cambiar-foto').addEventListener('click', () => inputFoto.click());
        inputFoto.addEventListener('change', async () => {
            const archivo = inputFoto.files[0];
            if (!archivo) return;
            const datos = new FormData();
            datos.append('foto', archivo);
            mensajeFoto.style.display = 'block';
            mensajeFoto.style.color = '#2563eb';
            mensajeFoto.textContent = 'Subiendo foto…';
            try {
                const respuesta = await fetch('/api/foto', { method: 'POST', body: datos });
                const resultado = await respuesta.json();
                if (respuesta.ok) {
                    mensajeFoto.style.color = '#059669';
                    mensajeFoto.textContent = '✅ ' + resultado.mensaje;
                    await cargarPerfil();
                    await cargarUsuarios();
                } else {
                    mensajeFoto.style.color = '#dc2626';
                    mensajeFoto.textContent = resultado.error;
                }
            } catch (error) {
                mensajeFoto.style.color = '#dc2626';
                mensajeFoto.textContent = 'No se pudo subir la foto.';
            }
            inputFoto.value = '';
        });

        cargarUsuarios();
        cargarPerfil();
    </script>
</body>
</html>
