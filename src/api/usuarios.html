<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios - APIs</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1e3a8a 0%, #6d28d9 50%, #d946ef 100%);
            padding: 24px;
        }
        .contenedor {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 18px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            padding: 28px;
        }
        .cabecera {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .cabecera-izquierda {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 0 12px rgba(30, 58, 138, 0.35);
        }
        h1 {
            background: linear-gradient(90deg, #1e3a8a, #7c3aed, #db2777);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-size: 2rem;
        }
        .acciones {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .boton-volver {
            text-decoration: none;
            border: 1.5px solid #7c3aed;
            color: #7c3aed;
            border-radius: 8px;
            padding: 10px 16px;
            font-weight: 600;
            transition: 0.2s;
            display: inline-block;
        }
        .boton-volver:hover { background: #f3e8ff; }
        .boton-salir {
            text-decoration: none;
            border: 1.5px solid #dc2626;
            color: #dc2626;
            border-radius: 8px;
            padding: 10px 16px;
            font-weight: 600;
            transition: 0.2s;
            display: inline-block;
            cursor: pointer;
        }
        .boton-salir:hover { background: #fef2f2; }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            overflow: hidden;
            border-radius: 10px;
        }
        thead { background: #eef2ff; }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
            text-align: left;
            font-size: 0.95rem;
        }
        #mensaje-vacio {
            margin-top: 10px;
            color: #475569;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <div class="cabecera">
            <div class="cabecera-izquierda">
                <img src="/static/logoFB.png" alt="Logo FB" class="logo">
                <h1>Lista de usuarios</h1>
            </div>
            <div class="acciones">
                <a href="/api/usuarios" class="boton-volver">Ver datos (JSON)</a>
                <a href="/logout" class="boton-salir">Salir</a>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Email</th>
                    <th>Foto</th>
                </tr>
            </thead>
            <tbody id="cuerpo-tabla"></tbody>
        </table>
        <p id="mensaje-vacio">Cargando usuarios…</p>
    </div>

    <script>
        const cuerpoTabla = document.getElementById('cuerpo-tabla');
        const mensajeVacio = document.getElementById('mensaje-vacio');

        async function cargarUsuarios() {
            mensajeVacio.style.display = 'block';
            mensajeVacio.textContent = 'Cargando usuarios…';
            cuerpoTabla.innerHTML = '';

            try {
                const respuesta = await fetch('/api/usuarios');
                const usuarios = await respuesta.json();

                if (!Array.isArray(usuarios) || usuarios.length === 0) {
                    mensajeVacio.textContent = 'No hay usuarios todavía. Créalos desde el formulario de registro.';
                    return;
                }

                mensajeVacio.style.display = 'none';

                usuarios.forEach((u) => {
                    const fila = document.createElement('tr');
                    fila.innerHTML = `
                        <td>${u.id}</td>
                        <td>${u.nombre}</td>
                        <td>${u.email}</td>
                        <td>${u.foto || '—'}</td>
                    `;
                    cuerpoTabla.appendChild(fila);
                });
            } catch (error) {
                mensajeVacio.style.display = 'block';
                mensajeVacio.textContent = 'No se pudo cargar la lista de usuarios.';
            }
        }

        cargarUsuarios();
    </script>
</body>
</html>
